name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx expo export --platform web

      # Expo's web export only emits a favicon <link>; inject the apple-touch-icon
      # link so iOS uses public/apple-touch-icon.png for home-screen bookmarks.
      # Runs before the 404 copy so 404.html inherits the same <head>.
      - name: Inject apple-touch-icon link
        run: sed -i 's#</head>#<link rel="apple-touch-icon" href="/peach/apple-touch-icon.png" /></head>#' dist/index.html

      - name: Add 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
